[workspace]
resolver = "2"
members = [
    "crates/cftp-proto",
    "crates/cftp-core",
    "crates/cftp-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.88"
authors = ["Conleth <103609099@student.swin.edu.au>"]
description = "QUIC-based file transfer with zstd compression and mutual TLS"
repository = "https://github.com/connythecreator/cftp"
homepage = "https://github.com/connythecreator/cftp"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
directories = "6"
filetime = "0.2"
hex = "0.4"
indicatif = "0.18"
postcard = { version = "1.1", features = ["use-std"] }
rcgen = { version = "0.14", features = ["pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
