[workspace]
resolver = "2"
members = [
    "crates/cftp-proto",
    "crates/cftp-core",
    "crates/cftp-cli",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false
rust-version = "1.88"
authors = ["Conleth <103609099@student.swin.edu.au>"]
description = "QUIC-based file transfer with SSH-key authentication, zstd compression, and optional mutual TLS"
repository = "https://github.com/connythecreator/cftp"
homepage = "https://github.com/connythecreator/cftp"

[workspace.dependencies]
anyhow = "1"
blake3 = "1.8"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.2"
crossterm = "0.29"
directories = "6"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
filetime = "0.2"
hex = "0.4"
hmac = "0.12"
indicatif = "0.18"
netdev = "0.46"
postcard = { version = "1.1", features = ["use-std"] }
p256 = { version = "0.13", features = ["pkcs8"] }
p384 = { version = "0.13", features = ["pkcs8"] }
rcgen = { version = "0.14", features = ["pem"] }
rsa = "0.9"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "rsa", "p256", "p384", "encryption", "getrandom"] }
thiserror = "2"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
walkdir = "2"
zstd = "0.14"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
