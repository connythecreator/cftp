version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      # This action's ref is the Rust toolchain version (for example 1.88.0),
      # not an action release. Dependabot otherwise proposes nonexistent
      # toolchains such as 1.120.0.
      - dependency-name: "dtolnay/rust-toolchain"
