worker_processes auto;
user www-data;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    # Keep upload bodies in memory up to 64 MiB. Larger bodies are spooled to
    # the client_body_temp_path and renamed into place, which is how nginx
    # normally handles PUT; the buffer avoids an extra copy for the gate's
    # small and medium files.
    client_body_temp_path /srv/bench/nginx-temp;
    client_body_buffer_size 64m;
    client_max_body_size 0;
    sendfile on;
    access_log off;

    server {
        listen 127.0.0.1:8080;
        root /srv/bench/http;

        location / {
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
        }
    }

    # TLS twin of the plaintext server. curl verifies this certificate against
    # /etc/ssl/cftp-gate.crt, so the HTTPS row measures the same upload path
    # with authentication and encryption enabled.
    server {
        listen 127.0.0.1:8443 ssl;
        ssl_certificate /etc/ssl/cftp-gate.crt;
        ssl_certificate_key /etc/ssl/cftp-gate.key;
        ssl_protocols TLSv1.3;
        root /srv/bench/https;

        location / {
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
        }
    }
}
